services:
  - type: web
    name: ultimate-pool-3d-server
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build:backend
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: WS_HEARTBEAT_MS
        value: "15000"
      - key: RECONNECT_GRACE_MS
        value: "30000"
      - key: MATCHMAKING_TIMEOUT_MS
        value: "45000"
      - key: ROOM_TTL_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_MSG_PER_SEC
        value: "45"
      - key: PHYSICS_BROADCAST_HZ
        value: "35"
      - key: MAX_LATENCY_SPREAD_MS
        value: "250"
